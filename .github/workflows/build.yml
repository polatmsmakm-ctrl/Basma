name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Basma.xcodeproj \
            -scheme Basma \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Basma.app Payload/
          zip -qr Basma.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Basma-ipa
          path: Basma.ipa

      - name: Publish release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Basma (latest)
          files: Basma.ipa
