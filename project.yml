name: Basma
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Basma:
    type: application
    platform: iOS
    sources:
      - path: Basma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.basma
        PRODUCT_NAME: Basma
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Basma/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Basma/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: "بصمتي"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
