name: Basma
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Basma:
    type: application
    platform: iOS
    sources:
      - path: Basma
      - path: Shared
    dependencies:
      - target: BasmaWidget
    entitlements:
      path: Basma/Basma.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rashid.basma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.basma
        PRODUCT_NAME: Basma
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Basma/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -weak_framework AlarmKit -weak_framework ActivityKit"
    info:
      path: Basma/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: "بصمتي"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "لضبط منبّهات تذكّرك ببصمة الدخول والتواجد والخروج."
        NSLocationWhenInUseUsageDescription: "لتحديد موقع دوامك وتذكيرك بالبصمة عند الوصول والمغادرة."
        NSLocationAlwaysAndWhenInUseUsageDescription: "لتذكيرك بالبصمة عند وصولك للدوام ومغادرته حتى لو التطبيق مغلق."
  BasmaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BasmaWidget
      - path: Shared
    entitlements:
      path: BasmaWidget/BasmaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rashid.basma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.basma.widget
        PRODUCT_NAME: BasmaWidget
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        INFOPLIST_FILE: BasmaWidget/Info.plist
        OTHER_LDFLAGS: "$(inherited) -weak_framework AlarmKit -weak_framework ActivityKit"
    info:
      path: BasmaWidget/Info.plist
      properties:
        CFBundleDisplayName: "بصمتي"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
